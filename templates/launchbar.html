<div class="launchbar" id="launchbar" data-end="{{launch_end}}" data-code="{{launch_code}}" role="note"><p>Launch week: 50% off any pack with code <b>{{launch_code}}</b>, applied automatically at checkout, until {{launch_end_label}}</p><button type="button" aria-label="Dismiss offer">&times;</button></div>
<script>(function(){var b=document.getElementById("launchbar"),c=b.dataset.code,e=Date.parse(b.dataset.end);if(c&&Date.now()<e)document.addEventListener("DOMContentLoaded",function(){if(Date.now()>=e)return;var l=document.querySelectorAll("a[data-checkout=polar]");for(var i=0;i<l.length;i++)try{var u=new URL(l[i].href);u.searchParams.set("discount_code",c);l[i].href=u.toString();var m=/^Buy now, \$(\d+)$/.exec(l[i].textContent.trim());if(m){var w=+m[1]/2,n=w%1?w.toFixed(2):String(w),s=document.createElement("s");s.textContent="$"+m[1];l[i].textContent="Buy now, ";l[i].appendChild(s);l[i].appendChild(document.createTextNode(" $"+n));l[i].setAttribute("aria-label","Buy now, $"+n+" with "+c+", was $"+m[1])}}catch(x){}})})()</script>
<script>(function(){var b=document.getElementById("launchbar"),k="ss-launch50-x";function h(){b.hidden=true}try{if(Date.now()>Date.parse(b.dataset.end)||localStorage.getItem(k))return h()}catch(e){if(Date.now()>Date.parse(b.dataset.end))return h()}b.querySelector("button").onclick=function(){h();try{localStorage.setItem(k,"1")}catch(e){}}})()</script>
