name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      # build.py and the tests are stdlib only (python3, node), so nothing is installed.
      # Several tests read the built pages, so the build runs first.
      - name: build
        run: python3 build.py
      - name: tests
        run: |
          status=0
          for t in tests/*_test.mjs; do
            echo "::group::$t"
            node "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
